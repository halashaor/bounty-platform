[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-team-cli"
version = "0.1.0"
description = "Mission team task CLI for people and AI agents"
requires-python = ">=3.10"

[project.scripts]
mission = "mission_cli:main"

[tool.setuptools]
py-modules = ["mission_cli"]
