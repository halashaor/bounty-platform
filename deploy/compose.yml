name: bounty-platform
services:
  web:
    image: ${BOUNTY_IMAGE:?set BOUNTY_IMAGE}
    container_name: bounty-platform
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      - ${TEAM_ACCOUNTS_DIR:?set TEAM_ACCOUNTS_DIR}:/accounts
    networks:
      proxy:
        aliases: [bounty-platform]
    group_add: ["${TEAM_ACCOUNTS_GID:?set TEAM_ACCOUNTS_GID}"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  proxy:
    external: true
    name: ${BOUNTY_PROXY_NETWORK:?set BOUNTY_PROXY_NETWORK}
