{# 一整件作品：页面加载后由 static/iso.js 画成立体的，画好之前先露出底色 #}
{% macro build_svg(build, cls='', label=none) -%}
<svg class="build{{ ' ' ~ cls if cls }}" viewBox="0 0 10 10" data-build='{{ dict(bg=build.bg, view=build.view or 0, parts=build.parts)|tojson }}' {% if label %}role="img" aria-label="{{ label }}"{% else %}aria-hidden="true"{% endif %}><rect width="10" height="10" fill="#F7F6F2"/></svg>
{%- endmacro %}

{# 零件小图：零件盒、游戏角的解锁路线上用 #}
{% macro part_icon(part, color='ink') -%}
<svg class="part-icon" viewBox="0 0 10 10" data-part-icon="{{ part }}" data-color="{{ color }}" aria-hidden="true"></svg>
{%- endmacro %}
